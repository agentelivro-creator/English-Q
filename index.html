<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070a14">
<title>English Quest</title>
<style>:root{--bg:#070a14;--card:#0f1528;--card2:#151d38;--line:#26335c;--cy:#22d3ee;--mg:#e879f9;--gr:#4ade80;--yl:#facc15;--rd:#fb7185;--tx:#e8ecff;--mu:#8b97c4;
--mono:ui-monospace,"SF Mono","Courier New",monospace;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
body{background:radial-gradient(1200px 500px at 50% -10%,#16204a 0,transparent 60%),linear-gradient(transparent 95%,rgba(34,211,238,.05) 95%) 0 0/100% 28px,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.screen{display:none;flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(var(--sat) + 10px) 14px 96px;-webkit-overflow-scrolling:touch}
.screen.on{display:block}
.mono{font-family:var(--mono);letter-spacing:.04em}
h1,h2,h3{margin:0;font-family:var(--mono);letter-spacing:.05em}
/* HUD */
.hud{background:linear-gradient(135deg,#131c3d,#0d1330);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 0 22px rgba(34,211,238,.08)}
.hud-top{display:flex;align-items:center;gap:12px}
.avatar{width:52px;height:52px;border-radius:14px;background:#0b1230;border:2px solid var(--cy);display:grid;place-items:center;font-size:28px;box-shadow:0 0 14px rgba(34,211,238,.35)}
.rank{font-family:var(--mono);font-weight:800;color:var(--cy);font-size:17px;text-transform:uppercase}
.sub{color:var(--mu);font-size:12px}
.bar{height:12px;border-radius:99px;background:#0a0f22;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--mg));border-radius:99px;transition:width .4s}
.chips{display:flex;gap:8px;margin-top:10px}
.chip{flex:1;background:#0b1230;border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px}
.chip small{display:block;color:var(--mu);font-weight:400;font-size:10px}
/* mapa */
.unit{background:var(--card);border:2px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden}
.unit.lock{opacity:.55}
.uh{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.uh .ic{font-size:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.uh h3{font-size:16px;color:#06101a;text-transform:uppercase}
.uh .sub{color:rgba(0,0,0,.65)}
.lvl{margin-left:auto;font-family:var(--mono);font-weight:800;background:rgba(0,0,0,.35);color:#fff;padding:4px 9px;border-radius:99px;font-size:12px}
.L-A1{--c1:#22d3ee;--c2:#38bdf8}.L-A2{--c1:#4ade80;--c2:#2dd4bf}.L-B1{--c1:#facc15;--c2:#fb923c}.L-B2{--c1:#e879f9;--c2:#a78bfa}.L-C1{--c1:#fb7185;--c2:#f59e0b}
.nodes{display:flex;justify-content:space-around;align-items:center;padding:16px 8px 14px}
.node{width:62px;height:62px;border-radius:50%;border:3px solid var(--line);background:var(--card2);display:grid;place-items:center;font-size:22px;position:relative;border-bottom-width:6px;transition:transform .1s}
.node small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap;font-family:var(--mono)}
.node.av{border-color:var(--cy);background:#0b2a38;animation:pulse 1.6s infinite}
.node.done{border-color:var(--yl);background:#33290a}
.node.boss{width:72px;height:72px;font-size:30px}
.node.boss.av{border-color:var(--rd);background:#3a1220;animation:pulseR 1.4s infinite}
.node:active{transform:translateY(3px)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}50%{box-shadow:0 0 0 10px rgba(34,211,238,0)}}
@keyframes pulseR{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.6)}50%{box-shadow:0 0 0 12px rgba(251,113,133,0)}}
.nodes{padding-bottom:30px}
/* botões */
.btn{display:block;width:100%;background:var(--cy);color:#03222c;border:0;border-bottom:5px solid #0e7490;border-radius:14px;padding:13px 16px;font-family:var(--mono);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:#26335c;border-bottom-color:#18213f;color:#6b78a8}
.btn.mg{background:var(--mg);border-bottom-color:#a21caf;color:#2a0530}
.btn.gr{background:var(--gr);border-bottom-color:#15803d;color:#052e16}
.btn.rd{background:var(--rd);border-bottom-color:#be123c;color:#3b0715}
.btn.gh{background:transparent;color:var(--mu);border:2px solid var(--line);border-bottom-width:4px}
.btn.sm{width:auto;display:inline-block;padding:8px 12px;font-size:12px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;background:rgba(9,13,28,.96);backdrop-filter:blur(10px);border-top:2px solid var(--line);padding-bottom:var(--sab);z-index:20}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mu);font-size:11px;font-family:var(--mono);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:21px;font-weight:400;filter:grayscale(.8)}
nav button.on{color:var(--cy)}nav button.on b{filter:none;text-shadow:0 0 12px var(--cy)}
/* lição */
#lesson{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;max-width:560px;margin:0 auto}
#lesson.on{display:flex}
.lh{display:flex;align-items:center;gap:10px;padding:calc(var(--sat) + 10px) 14px 6px}
.x{background:none;border:0;color:var(--mu);font-size:26px;padding:0 4px}
.lh .bar{flex:1;margin:0;height:14px}
.hearts{font-size:15px;white-space:nowrap}
.bossrow{display:none;align-items:center;gap:10px;padding:2px 14px 0}
.bossrow.on{display:flex}
.bossrow .be{font-size:30px}
.bossrow .bar{flex:1;height:16px;margin:0}
.bossrow .bar>i{background:linear-gradient(90deg,#f43f5e,#fb923c)}
#lbody{flex:1;overflow-y:auto;padding:18px 16px 10px;display:flex;flex-direction:column;gap:14px}
.qtype{font-family:var(--mono);font-size:12px;color:var(--mg);text-transform:uppercase;letter-spacing:.12em}
.prompt{font-size:26px;font-weight:800;line-height:1.25;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prompt.sm{font-size:21px}
.say{width:52px;height:52px;border-radius:14px;background:var(--cy);border:0;border-bottom:4px solid #0e7490;font-size:24px;flex:none}
.say.big{width:96px;height:96px;font-size:44px;border-radius:24px;margin:6px auto}
.hint{color:var(--mu);font-size:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card2);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px;font-size:18px;text-align:left;font-weight:600}
.opt:active{transform:translateY(2px)}
.opt.ok{border-color:var(--gr);background:#0b2d1a;color:#c8ffd9}
.opt.bad{border-color:var(--rd);background:#38101a;color:#ffd0d8}
.opt.sel{border-color:var(--cy);background:#0b2a38}
.opt.gone{visibility:hidden}
input.txt{width:100%;background:var(--card2);border:2px solid var(--line);border-radius:14px;padding:14px;font-size:20px;color:var(--tx);outline:none;-webkit-user-select:text;user-select:text;font-family:inherit}
input.txt:focus{border-color:var(--cy)}
.line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.tile{background:var(--card2);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 13px;font-size:18px;font-weight:600}
.tile.used{opacity:.15;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{padding:12px 10px;font-size:16px;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.link{color:var(--cy);font-size:13px;text-decoration:underline;background:none;border:0;padding:4px 0;align-self:flex-start}
#lfoot{padding:10px 14px calc(var(--sab) + 12px);border-top:2px solid var(--line);background:#0a0f20}
.fb{margin:-10px -14px 10px;padding:14px 16px 4px}
.fb b{font-family:var(--mono);font-size:18px;display:block;margin-bottom:2px}
.fb.ok{background:#0b2d1a;color:#86efac}.fb.bad{background:#38101a;color:#fda4af}
.fb span{font-size:15px;color:var(--tx)}
.combo{position:fixed;bottom:190px;left:50%;margin-left:-60px;width:120px;text-align:center;font-family:var(--mono);font-weight:800;color:var(--yl);font-size:20px;text-shadow:0 0 14px var(--yl);z-index:60;animation:pop .6s forwards;pointer-events:none}
@keyframes pop{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:translateY(-30px);opacity:0}}
/* modal / resultado */
#modal{position:fixed;inset:0;z-index:80;background:rgba(3,5,12,.86);display:none;align-items:center;justify-content:center;padding:18px}
#modal.on{display:flex}
.box{width:100%;max-width:420px;max-height:92vh;overflow-y:auto;background:linear-gradient(160deg,#141d40,#0c1230);border:2px solid var(--cy);border-radius:22px;padding:20px;box-shadow:0 0 40px rgba(34,211,238,.25);text-align:center}
.box h2{font-size:26px;color:var(--yl);text-shadow:0 0 18px rgba(250,204,21,.5);margin-bottom:6px}
.box.lose{border-color:var(--rd)}.box.lose h2{color:var(--rd);text-shadow:0 0 18px rgba(251,113,133,.5)}
.box p{color:var(--tx);line-height:1.5;margin:8px 0}
.box .tipb{text-align:left;background:#0b1230;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;line-height:1.55}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:#0b1230;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-family:var(--mono);font-weight:800;font-size:20px}
.stat small{display:block;color:var(--mu);font-size:10px;font-weight:400}
.big-e{font-size:56px}
.ach-new{background:#2a2108;border:1px solid var(--yl);border-radius:12px;padding:8px;margin:6px 0;font-size:14px;text-align:left}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
/* perfil */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.ach{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;font-size:13px;display:flex;gap:10px;align-items:center}
.ach.off{opacity:.4;filter:grayscale(1)}
.ach b{font-size:26px}
.ach span{line-height:1.25}.ach small{color:var(--mu);display:block;font-size:11px}
.sect{font-family:var(--mono);color:var(--cy);text-transform:uppercase;font-size:13px;letter-spacing:.14em;margin:18px 0 8px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.sw{width:50px;height:28px;border-radius:99px;background:#26335c;border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gr)}.sw.on::after{left:25px}
/* xadrez */
.coach{background:linear-gradient(135deg,#131c3d,#0d1330);border:2px solid var(--mg);border-radius:16px;padding:10px 14px;margin-bottom:10px;min-height:66px}
.coach b{display:block;font-size:17px}
.coach span{color:var(--mu);font-size:13px}
.board{--bs:min(calc(100vw - 28px),52vh,520px);width:var(--bs);height:var(--bs);margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);border:3px solid var(--cy);border-radius:10px;overflow:hidden;box-shadow:0 0 26px rgba(34,211,238,.25)}
.sq{position:relative;border:0;padding:0;margin:0;display:grid;place-items:center;font-size:calc(var(--bs)/8*.78);line-height:1;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif}
.sq.l{background:#2d3d68}.sq.d{background:#17213f}
.sq .pc{font-variant-emoji:text}
.sq.w .pc{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}
.sq.k .pc{color:#0a0e1c;text-shadow:0 0 2px #7dd3fc,0 0 3px #7dd3fc,0 0 6px #22d3ee}
.sq.last{box-shadow:inset 0 0 0 100px rgba(250,204,21,.22)}
.sq.sel{box-shadow:inset 0 0 0 100px rgba(34,211,238,.45)}
.sq.chk{box-shadow:inset 0 0 0 100px rgba(251,113,133,.6)}
.sq.dst::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(74,222,128,.75)}
.sq.dst.cap::after{width:88%;height:88%;background:none;border:4px solid rgba(251,113,133,.9)}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--mono);font-size:12px;font-weight:700;color:var(--mu)}
.seg button.on{border-color:var(--mg);color:var(--mg);background:#2a1033}
.cap-line{font-size:13px;color:var(--mu);min-height:20px;text-align:center;margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:#0b1230;border:2px solid var(--cy);color:var(--tx);padding:10px 16px;border-radius:14px;z-index:90;font-size:14px;max-width:90%;text-align:center}
.credit{text-align:center;margin:22px 0 6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#0b1230;font-size:14px;line-height:1.6}.credit b{font-family:var(--mono);color:var(--cy);letter-spacing:.1em;text-transform:uppercase}.credit div{color:var(--tx);font-weight:700}.credit small{display:block;color:var(--mu);font-size:11px}
#cover{position:fixed;inset:0;z-index:200;background:#00020a;display:flex;align-items:center;justify-content:center;transition:opacity .5s}
#cover img{width:min(100vw,100vh);height:min(100vw,100vh);max-width:560px;max-height:560px;object-fit:cover;border-radius:18px}
#cover .tap{position:absolute;bottom:calc(60px + var(--sab));font-family:var(--mono);font-weight:800;letter-spacing:.2em;color:var(--cy);font-size:14px;animation:blink 1.2s infinite}
#cover.out{opacity:0;pointer-events:none}
@keyframes blink{50%{opacity:.25}}
</style>
</head>
<body>
<div id="app">
  <div class="screen on" id="home"></div>
  <div class="screen" id="practice"></div>
  <div class="screen" id="chess"></div>
  <div class="screen" id="profile"></div>
</div>
<nav>
  <button data-s="home" class="on"><b>🗺️</b>APRENDER</button>
  <button data-s="practice"><b>🎯</b>TREINO</button>
  <button data-s="chess"><b>♞</b>XADREZ</button>
  <button data-s="profile"><b>🏆</b>PERFIL</button>
</nav>
<div id="lesson">
  <div class="lh"><button class="x" id="lx">✕</button><div class="bar"><i id="lbar" style="width:0"></i></div><div class="hearts" id="hearts"></div></div>

  <div id="lbody"></div>
  <div id="lfoot"></div>
</div>

<script>
const Chess=(()=>{
const N=[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];

function start(){return fromFEN('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1')}
function fromFEN(f){
  const [pl,t,ca,ep,hm,fm]=f.split(' ');const b=[];
  for(const ch of pl){if(ch==='/')continue;if(/\d/.test(ch)){for(let i=0;i<+ch;i++)b.push('.')}else b.push(ch)}
  return {b,t,c:{K:+ca.includes('K'),Q:+ca.includes('Q'),k:+ca.includes('k'),q:+ca.includes('q')},
    ep:ep&&ep!=='-'?(8-+ep[1])*8+'abcdefgh'.indexOf(ep[0]):-1,hm:+hm||0,fm:+fm||1};
}
function attacked(b,sq,by){
  const r=sq>>3,c=sq&7,w=by==='w';
  const pr=w?r+1:r-1,pp=w?'P':'p';
  for(const dc of[-1,1]){const cc=c+dc;if(inb(pr,cc)&&b[pr*8+cc]===pp)return true}
  const kn=w?'N':'n',kg=w?'K':'k';
  for(const[a,d]of N){const rr=r+a,cc=c+d;if(inb(rr,cc)&&b[rr*8+cc]===kn)return true}
  for(const[a,d]of KD){const rr=r+a,cc=c+d;if(inb(rr,cc)&&b[rr*8+cc]===kg)return true}
  const bq=w?'BQ':'bq',rq=w?'RQ':'rq';
  for(const[a,d]of BD){let rr=r+a,cc=c+d;while(inb(rr,cc)){const p=b[rr*8+cc];if(p!=='.'){if(bq.includes(p))return true;break}rr+=a;cc+=d}}
  for(const[a,d]of RD){let rr=r+a,cc=c+d;while(inb(rr,cc)){const p=b[rr*8+cc];if(p!=='.'){if(rq.includes(p))return true;break}rr+=a;cc+=d}}
  return false;
}
function pseudo(s){
  const {b,t}=s,w=t==='w',out=[],en=w?'b':'w';
  const mine=p=>p!=='.'&&isW(p)===w, theirs=p=>p!=='.'&&isW(p)!==w;
  for(let sq=0;sq<64;sq++){
    const p=b[sq];if(p==='.'||!mine(p))continue;

      const add=(to,x)=>{if((to>>3)===pr){for(const q of 'qrbn')out.push({f:sq,t:to,p:q,cap:x})}else out.push({f:sq,t:to,cap:x})};
      if(inb(r1,c)&&b[r1*8+c]==='.'){
        add(r1*8+c,false);
        if(r===sr&&b[(r+2*d)*8+c]==='.')out.push({f:sq,t:(r+2*d)*8+c,dbl:true});
      }
      for(const dc of[-1,1]){const cc=c+dc;if(!inb(r1,cc))continue;const to=r1*8+cc;

      if(pl==='k'){
        if(w&&sq===60){
          if(s.c.K&&b[61]==='.'&&b[62]==='.'&&b[63]==='R'&&!attacked(b,60,en)&&!attacked(b,61,en)&&!attacked(b,62,en))out.push({f:60,t:62,castle:true});
          if(s.c.Q&&b[59]==='.'&&b[58]==='.'&&b[57]==='.'&&b[56]==='R'&&!attacked(b,60,en)&&!attacked(b,59,en)&&!attacked(b,58,en))out.push({f:60,t:58,castle:true});
        }

          if(s.c.q&&b[3]==='.'&&b[2]==='.'&&b[1]==='.'&&b[0]==='r'&&!attacked(b,4,en)&&!attacked(b,3,en)&&!attacked(b,2,en))out.push({f:4,t:2,castle:true});
        }
      }
    }else{

function make(s,m){

function kingSq(b,t){return b.indexOf(t==='w'?'K':'k')}
function inCheck(s,t){t=t||s.t;return attacked(s.b,kingSq(s.b,t),t==='w'?'b':'w')}

function key(s){return s.b.join('')+s.t+s.c.K+s.c.Q+s.c.k+s.c.q+s.ep}
function insufficient(b){
  const ps=b.filter(p=>p!=='.'&&p.toLowerCase()!=='k');

// status: ongoing | check | checkmate | stalemate | draw
function status(s,seen){

const V={p:100,n:320,b:330,r:500,q:900,k:0};
function pst(p,sq){

function evalS(s){

function search(s,d,a,b,ply){

    h('div',{class:'sect'},'Conquistas ('+Object.keys(S.ach).length+'/'+ACH.length+')'),
    h('div',{class:'grid2'},ACH.map(a=>h('div',{class:'ach'+(S.ach[a.id]?'':' off')},h('b',{},a.i),h('span',{},a.n,h('small',{},a.d))))),
    h('div',{class:'sect'},'Configurações'),
    h('div',{class:'card'},
      sw('🔊 Efeitos sonoros','sound'),sw('🗣️ Voz em inglês (pronúncia)','voice'),sw('🎧 Exercícios de áudio','audioEx'),
      h('div',{class:'stack'},h('button',{class:'btn gh',onclick:()=>pickLevel(true)},'Mudar meu nível'),h('button',{class:'btn gh',onclick:()=>modal(h('div',{class:'box lose'},h('h2',{},'APAGAR TUDO?'),h('p',{},'Todo o seu progresso será perdido.'),h('div',{class:'stack'},h('button',{class:'btn',onclick:closeModal},'Cancelar'),h('button',{class:'btn rd',onclick:()=>{S=JSON.parse(JSON.stringify(DEF));save();closeModal();pickLevel()}},'Apagar'))))},'Apagar progresso'))),
    h('div',{class:'credit'},h('b',{},'English Quest'),h('div',{},'Desenvolvido por Josimar'),h('small',{},'© '+new Date().getFullYear()+' Josimar · Todos os direitos reservados')));
  function sw(label,k){const b=h('button',{class:'sw'+(S[k]?' on':''),onclick:()=>{S[k]=!S[k];b.classList.toggle('on',S[k]);save()}});return h('div',{class:'row'},h('span',{},label),b)}
}
function pickLevel(fromProfile){
  const opt=(t,s,u)=>h('button',{class:'btn '+(u===0?'':u===4?'gr':u===7?'mg':'rd'),style:'text-align:left',onclick:()=>{S.level=u;S.unlocked=Math.max(fromProfile?S.unlocked:0,u);save();closeModal();show('home')}},t,h('div',{style:'font-weight:400;text-transform:none;font-size:12px;letter-spacing:0;margin-top:2px'},s));
  modal(h('div',{class:'box'},h('div',{class:'big-e'},'🎮'),h('h2',{},'ESCOLHA SEU NÍVEL'),h('p',{},'Onde você quer começar? Você pode mudar depois no Perfil.'),
    h('div',{class:'stack'},opt('🐣 Do zero','Nunca estudei inglês (A1)',0),opt('🎮 Sei o básico','Já entendo frases simples (A2)',4),opt('⚔️ Intermediário','Converso um pouco (B1)',7),opt('👑 Avançado','Quero refinar o inglês (B2/C1)',10),
      fromProfile?h('button',{class:'btn gh',onclick:closeModal},'Cancelar'):null)));
}

/* ===== XADREZ ===== */
const PN={P:['Pawn','Peão'],N:['Knight','Cavalo'],B:['Bishop','Bispo'],R:['Rook','Torre'],Q:['Queen','Rainha'],K:['King','Rei']};
const GL={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const sqn=i=>'abcdefgh'[i&7]+(8-(i>>3));
let CG=null;
function renderChess(){
  const el=$('#chess');el.innerHTML='';
  if(!CG)chessNew(true);
  el.append(h('div',{class:'sect',style:'margin-top:4px'},'♞ Chess Arena — aprenda jogando'),
    h('div',{class:'coach',id:'coach'},h('b',{id:'ce'}),h('span',{id:'cp'})),
    h('div',{class:'board',id:'board'}),
    h('div',{class:'cap-line',id:'capl'}),
    h('div',{class:'seg'},['Fácil','Médio','Difícil'].map((n,i)=>h('button',{class:S.chessLvl===i?'on':'',onclick:()=>{S.chessLvl=i;save();CG.lvl=i;renderChess()}},n))),
    h('div',{class:'grid2',style:'margin:6px 0'},h('button',{class:'btn gh sm',style:'width:100%',onclick:()=>{if(CG.think)return;CG.s0=null;chessNew();renderChess()}},'🔄 Novo jogo'),h('button',{class:'btn gh sm',style:'width:100%',onclick:chessUndo},'↩ Desfazer')),
    h('div',{class:'card'},h('h3',{style:'font-size:15px'},'📘 Aulas de xadrez em inglês'),h('p',{class:'sub'},'Aprenda os nomes das peças e frases do jogo. Dentro da partida, o treinador fala tudo em inglês!'),
      h('div',{class:'stack'},CHESS_LESSONS.map((l,i)=>h('button',{class:'btn mg',onclick:()=>startRun({title:l.name,qs:buildLesson(l,-1),key:'c.'+i,back:'chess',rebuild:()=>buildLesson(l,-1)})},(S.done['c.'+i]?'⭐ ':'')+l.name)))),
    h('div',{class:'card'},h('h3',{style:'font-size:15px'},'🏆 Recompensas'),h('p',{class:'sub'},'Vitória: Fácil +20🪙, Médio +40🪙, Difícil +80🪙 e muito XP. Empate: +10🪙.')));
  drawBoard();updCoach();
}
function chessNew(silent){
  CG={s:Chess.start(),hist:[],seen:{},sel:null,mv:[],last:null,over:false,think:false,cap:{w:[],b:[]},lvl:S.chessLvl||0,en:'Your turn. You are White.',pt:'Sua vez. Você joga de brancas.'};
  CG.seen[Chess.key(CG.s)]=1;if(!silent)updCoach();
}
function setCoach(en,pt,speak){CG.en=en;CG.pt=pt;updCoach();if(speak!==false)say(en)}
function updCoach(){const a=$('#ce'),b=$('#cp');if(a&&CG){a.textContent=CG.en;b.textContent=CG.pt}const c=$('#capl');if(c&&CG)c.textContent=(CG.cap.w.length?'Você capturou: '+CG.cap.w.map(p=>GL[p.toUpperCase()]+'︎').join(' '):'')+(CG.cap.b.length?'   ·   Perdeu: '+CG.cap.b.map(p=>GL[p.toUpperCase()]+'︎').join(' '):'')}
function drawBoard(){
  const bd=$('#board');if(!bd||!CG)return;bd.innerHTML='';
  const kSq=Chess.inCheck(CG.s)?CG.s.b.indexOf(CG.s.t==='w'?'K':'k'):-1;
  for(let i=0;i<64;i++){
    const p=CG.s.b[i],r=i>>3,c=i&7,isDst=CG.mv.some(m=>m.t===i);
    let cls='sq '+((r+c)%2?'d':'l');
    if(p!=='.')cls+=Chess.isW(p)?' w':' k';
    if(CG.last&&(CG.last[0]===i||CG.last[1]===i))cls+=' last';
    if(CG.sel===i)cls+=' sel';if(i===kSq)cls+=' chk';
    if(isDst)cls+=' dst'+(p!=='.'||CG.mv.find(m=>m.t===i&&m.ep)?' cap':'');
    bd.append(h('button',{class:cls,onclick:()=>chessTap(i),'aria-label':sqn(i)},p!=='.'?h('span',{class:'pc'},GL[p.toUpperCase()]+'︎'):null));
  }
}
function chessTap(i){
  if(!CG||CG.over||CG.think)return;
  const p=CG.s.b[i];
  if(CG.sel!==null){const m=CG.mv.filter(x=>x.t===i);if(m.length){doMove(m.find(x=>x.p==='q')||m[0],'me');return}}
  if(p!=='.'&&Chess.isW(p)){
    CG.sel=i;CG.mv=Chess.legal(CG.s).filter(m=>m.f===i);const n=PN[p.toUpperCase()];
    setCoach(n[0],n[1]+(CG.mv.length?'':' — sem jogadas agora'),true);sfx('click');
  }else{CG.sel=null;CG.mv=[]}
  drawBoard();
}
function doMove(m,who){
  const s=CG.s,p=s.b[m.f],w=Chess.isW(p),vic=m.ep?s.b[m.t+(w?8:-8)]:s.b[m.t];
  if(who==='me')CG.hist.push({s:CG.s,last:CG.last,cap:{w:CG.cap.w.slice(),b:CG.cap.b.slice()},seen:Object.assign({},CG.seen),en:CG.en,pt:CG.pt});
  const pn=PN[p.toUpperCase()];let en,pt;
  if(m.castle){en='castles';pt='faz o roque'}
  else if(vic!=='.'){const vn=PN[vic.toUpperCase()];en=`${pn[0]} takes ${vn[0]} on ${sqn(m.t)}`;pt=`${pn[1]} captura ${vn[1]} em ${sqn(m.t)}`;(w?CG.cap.w:CG.cap.b).push(vic);sfx('coin')}
  else{en=`${pn[0]} to ${sqn(m.t)}`;pt=`${pn[1]} para ${sqn(m.t)}`;sfx('click')}
  if(m.p){en+=', promotes to Queen';pt+=', promove a Rainha'}
  CG.s=Chess.make(s,m);CG.last=[m.f,m.t];CG.sel=null;CG.mv=[];
  const k=Chess.key(CG.s);CG.seen[k]=(CG.seen[k]||0)+1;
  const st=Chess.status(CG.s,CG.seen),who2=who==='me'?'You':'Computer',who2p=who==='me'?'Você':'Computador';
  let en2=`${who2}: ${en}.`,pt2=`${who2p}: ${pt}.`;
  if(st==='check'){en2+=' Check!';pt2+=' Xeque!'}
  if(st==='ongoing'||st==='check'){
    if(who==='me'){setCoach(en2,pt2);CG.think=true;drawBoard();setTimeout(aiMove,450);return}
    setCoach(en2+' Your turn.',pt2+' Sua vez.');drawBoard();return;
  }
  CG.over=true;drawBoard();chessEnd(st,who,en2,pt2);
}
function aiMove(){
  if(!CG||CG.over)return;
  const d=[1,2,3][CG.lvl],noise=[60,6,0][CG.lvl];
  const m=Chess.best(CG.s,d,noise);CG.think=false;if(m)doMove(m,'ai');
}
function chessUndo(){
  if(!CG||CG.think||!CG.hist.length||CG.over&&false)return;
  const h0=CG.hist.pop();Object.assign(CG,h0,{sel:null,mv:[],over:false,think:false});setCoach('Move undone. Your turn.','Jogada desfeita. Sua vez.',false);drawBoard();
}
function chessEnd(st,who,en,pt){
  let win=st==='checkmate'&&who==='me',lose=st==='checkmate'&&who==='ai',coins=0,xp=0;
  if(win){coins=[20,40,80][CG.lvl];xp=[50,100,200][CG.lvl];S.chessWins++;S.stats.chess++;sfx('win')}
  else if(!lose){coins=10;xp=10;sfx('click')}else sfx('lose');
  S.coins+=coins;S.xp+=xp;if(coins)bumpStreak();const na=checkAch();save();
  const title=win?'YOU WIN!':lose?'YOU LOSE':'DRAW';
  const line=win?['Checkmate! You win!','Xeque-mate! Você venceu!']:lose?['Checkmate. The computer wins.','Xeque-mate. O computador venceu.']:st==='stalemate'?['Stalemate. It is a draw.','Afogamento. Deu empate.']:['It is a draw.','Deu empate.'];
  setCoach(line[0],line[1]);
  modal(h('div',{class:'box'+(lose?' lose':'')},h('div',{class:'big-e'},win?'🏆':lose?'💀':'🤝'),h('h2',{},title),h('p',{style:'font-weight:700'},line[0]),h('p',{class:'sub'},line[1]),
    coins?h('div',{class:'stats3',style:'grid-template-columns:1fr 1fr'},h('div',{class:'stat'},'+'+coins,h('small',{},'🪙 moedas')),h('div',{class:'stat'},'+'+xp,h('small',{},'XP'))):null,
    na.map(a=>h('div',{class:'ach-new',html:a.i+' Conquista: <b>'+a.n+'</b> (+15 🪙)'})),
    h('div',{class:'stack'},h('button',{class:'btn',onclick:()=>{closeModal();chessNew();renderChess()}},'Jogar de novo'),h('button',{class:'btn gh',onclick:closeModal},'Ver tabuleiro'))));
}

/* ===== boot ===== */
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{sfx('click');show(b.dataset.s)});
loadNative().then(()=>{show('home');if(S.level===null)pickLevel()});
